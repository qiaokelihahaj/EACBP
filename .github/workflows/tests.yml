name: tests
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python scripts/verify_ci_test_suite.py core

  scientific-capabilities:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - capability: standard
            extras: standard
          - capability: advanced-statistics
            extras: advanced-statistics
          - capability: advanced-qc
            extras: advanced-qc
          - capability: communication
            extras: communication
          - capability: fate
            extras: "standard,fate"
          - capability: velocity
            extras: "standard,velocity"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev,${{ matrix.extras }}]"
      - run: python scripts/verify_ci_capability_tests.py ${{ matrix.capability }}

  full-scientific-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev]"
      - run: python -m pip install --require-hashes -r docker/requirements-linux-py312-scientific.lock
      - run: python -m pip install --require-hashes -r docker/requirements-linux-py312-build.lock
      - run: python -m pip install --no-build-isolation --require-hashes -r docker/requirements-linux-py312-velocity.lock
      - run: python -m pip freeze > integration-pip-freeze.txt
      - run: python -m pip check
      - run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - run: python scripts/verify_ci_test_suite.py integration --junitxml=integration-junit.xml
      - name: Smoke-test installed wheel
        run: |
          set -o pipefail
          python scripts/verify_ci_installed_wheel.py dist/*.whl --lock docker/requirements-linux-py312-scientific.lock 2>&1 | tee wheel-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-integration-reports
          path: |
            integration-junit.xml
            integration-pip-freeze.txt
            wheel-smoke.log
          if-no-files-found: warn
