name: tests
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      # This module constructs real AnnData inputs at import time. Its runtime
      # coverage belongs to the Python 3.12 standard-capability lane below.
      - run: python -m pytest -q --ignore=tests/test_standard_study_script.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist

  scientific-capabilities:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - capability: standard
            extras: standard
          - capability: advanced-statistics
            extras: advanced-statistics
          - capability: advanced-qc
            extras: advanced-qc
          - capability: communication
            extras: communication
          - capability: fate
            extras: "standard,fate"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev,${{ matrix.extras }}]"
      - run: python scripts/verify_ci_capability_tests.py ${{ matrix.capability }}
