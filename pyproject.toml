[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eacbp"
version = "0.1.0"
description = "Evidence-aware Agentic Computational Biology Platform"
readme = "README.md"
authors = [{ name = "EACBP Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
bio = [
    "anndata>=0.9.0",
    "scanpy>=1.9.0",
]

standard = [
    "anndata>=0.10",
    "scanpy>=1.10",
    "harmonypy==0.0.10",
    "igraph>=0.11",
    "leidenalg>=0.10",
]
fate = ["cellrank>=2.3,<3", "anndata>=0.11,<0.13"]
advanced-statistics = [
    "pydeseq2>=0.5.4",
    "decoupler>=2.2.0",
]
advanced-qc = ["scanpy>=1.10", "scikit-image>=0.24", "celltypist>=1.7,<2"]
communication = ["liana>=1.10,<2"]

[project.scripts]
eacbp = "eacbp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_temp"

[tool.setuptools.packages.find]
include = ["eacbp*"]
exclude = ["tests*", "outputs*", "temp*", "scripts*"]

[tool.setuptools.package-data]
"eacbp.webui" = ["static/*.html", "static/*.css", "static/*.js"]
